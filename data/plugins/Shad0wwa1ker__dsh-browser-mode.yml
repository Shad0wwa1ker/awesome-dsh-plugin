url: https://github.com/Shad0wwa1ker/dsh-browser-mode
name: Shad0wwa1ker/dsh-browser-mode
category: browser
description:
  en: 'Adds a visible-browser Agent preset (persona and toolset for navigating, filling forms, clicking and screenshotting through the Playwright MCP toolset) plus a gate that refuses every browser tool call in other presets until the user approves that Session through the bundled browser_access tool. Needs the profile-level Playwright MCP provider rows documented in the repository.'
  zh: '新增「浏览器操作」Agent 预设（基于 Playwright MCP 工具集的导航、填表、点击与截图规程），并加门禁：其他预设里的浏览器工具调用一律拒绝，直到用户通过内置的 browser_access 工具授权该会话。需按仓库说明启用 profile 层的 Playwright MCP provider。'
